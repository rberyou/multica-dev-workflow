name: validate-future-components

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "secure-runtime/**"
      - "skills/multica-workflow-maintainer/**"
      - "scripts/generate_secure_runtime_manifest.py"
      - "scripts/package_secure_runtime.py"
      - "tests/test_secure_runtime_*.py"
      - ".github/workflows/validate-future-components.yml"
  pull_request:
    paths:
      - "secure-runtime/**"
      - "skills/multica-workflow-maintainer/**"
      - "scripts/generate_secure_runtime_manifest.py"
      - "scripts/package_secure_runtime.py"
      - "tests/test_secure_runtime_*.py"
      - ".github/workflows/validate-future-components.yml"

jobs:
  future-components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"
      - name: Install validation tools
        run: python -m pip install -r requirements.txt check-jsonschema
      - name: Validate future contracts
        run: |
          check-jsonschema --schemafile secure-runtime/policy/security-profile.schema.json secure-runtime/policy/runtime.example.json
          python -m py_compile scripts/package_secure_runtime.py scripts/generate_secure_runtime_manifest.py skills/multica-workflow-maintainer/scripts/maintenance_loop.py
          python scripts/generate_secure_runtime_manifest.py --check
      - name: Run future Python tests
        run: python -m unittest tests.test_secure_runtime_manifest tests.test_secure_runtime_package -v
      - name: Build secure runtime
        run: dotnet build secure-runtime/WorkflowSecureRuntime.sln --configuration Release
      - name: Run secure runtime security tests
        run: dotnet run --project secure-runtime/tests/WorkflowSecureRuntime.Tests/WorkflowSecureRuntime.Tests.csproj --configuration Release --no-build
      - name: Package Maintainer Skill
        run: python scripts/package_skills.py skills/multica-workflow-maintainer build/multica-workflow-maintainer.zip
