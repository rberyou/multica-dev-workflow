name: validate-phase1

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation tools
        run: python -m pip install -r requirements.txt check-jsonschema
      - name: Validate workflow schema
        run: |
          check-jsonschema --schemafile workflow.schema.json workflow.json
          check-jsonschema --schemafile docs/release-control-evidence.schema.json docs/release-control-evidence.json
      - name: Compile Phase 1 tools
        run: python -m py_compile scripts/workflow.py scripts/workflow_lib.py scripts/package_skills.py scripts/generate_audit_contract.py scripts/release.py skills/multica-workflow-observer/scripts/observer.py skills/multica-workflow-console/scripts/workflow_console.py
      - name: Verify Observer audit contract
        run: python scripts/generate_audit_contract.py --check
      - name: Run Phase 1 tests
        run: python -m unittest tests.test_manifest tests.test_observer tests.test_package_skills tests.test_reconcile tests.test_release -v
      - name: Package Phase 1 skills
        shell: bash
        run: |
          mkdir -p build/skills
          python scripts/package_skills.py skills/multica-requirement-intake build/skills/multica-requirement-intake.zip
          python scripts/package_skills.py skills/multica-workflow-manager build/skills/multica-workflow-manager.zip
          python scripts/package_skills.py skills/multica-workflow-observer build/skills/multica-workflow-observer.zip
          python scripts/package_skills.py skills/multica-workflow-console build/skills/multica-workflow-console.zip
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          for path in sorted(Path('build/skills').glob('*.zip')):
              print(f"{sha256(path.read_bytes()).hexdigest()}  {path}")
          PY
