name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"
      - name: Install validation tools
        run: python -m pip install -r requirements.txt check-jsonschema
      - name: Validate workflow schema
        run: |
          check-jsonschema --schemafile workflow.schema.json workflow.json
          check-jsonschema --schemafile docs/release-control-evidence.schema.json docs/release-control-evidence.json
          check-jsonschema --schemafile secure-runtime/policy/security-profile.schema.json secure-runtime/policy/runtime.example.json
      - name: Compile reconciler
        run: python -m py_compile scripts/workflow.py scripts/workflow_lib.py scripts/package_skills.py scripts/package_secure_runtime.py scripts/generate_audit_contract.py scripts/generate_secure_runtime_manifest.py scripts/release.py skills/multica-workflow-observer/scripts/observer.py skills/multica-workflow-maintainer/scripts/maintenance_loop.py skills/multica-workflow-console/scripts/workflow_console.py
      - name: Verify Observer audit contract
        run: python scripts/generate_audit_contract.py --check
      - name: Verify secure runtime bundle contract
        run: python scripts/generate_secure_runtime_manifest.py --check
      - name: Build secure runtime
        run: dotnet build secure-runtime/WorkflowSecureRuntime.sln --configuration Release
      - name: Run secure runtime security tests
        run: dotnet run --project secure-runtime/tests/WorkflowSecureRuntime.Tests/WorkflowSecureRuntime.Tests.csproj --configuration Release --no-build
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Package skills
        shell: bash
        run: |
          mkdir -p build/skills
          python scripts/package_skills.py skills/multica-requirement-intake build/skills/multica-requirement-intake.zip
          python scripts/package_skills.py skills/multica-workflow-manager build/skills/multica-workflow-manager.zip
          python scripts/package_skills.py skills/multica-workflow-observer build/skills/multica-workflow-observer.zip
          python scripts/package_skills.py skills/multica-workflow-maintainer build/skills/multica-workflow-maintainer.zip
          python scripts/package_skills.py skills/multica-workflow-console build/skills/multica-workflow-console.zip
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          for path in sorted(Path('build/skills').glob('*.zip')):
              print(f"{sha256(path.read_bytes()).hexdigest()}  {path}")
          PY
