name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation tools
        run: python -m pip install -r requirements.txt check-jsonschema
      - name: Validate workflow schema
        run: python -m check_jsonschema --schemafile workflow.schema.json workflow.json
      - name: Validate project delivery example
        run: python -m check_jsonschema --schemafile skills/multica-delivery-policy/references/project-delivery.schema.json skills/multica-delivery-policy/references/project-delivery.example.json
      - name: Compile tools
        run: python -m py_compile scripts/workflow.py scripts/workflow_lib.py scripts/package_skills.py scripts/release.py skills/multica-delivery-policy/scripts/delivery_policy.py skills/multica-workflow-incidents/scripts/incidents.py skills/multica-workflow-console/scripts/workflow_console.py
      - name: Run tests
        run: python -m unittest tests.test_manifest tests.test_docs tests.test_delivery_policy tests.test_incidents tests.test_package_skills tests.test_reconcile tests.test_release -v
      - name: Package skills
        shell: bash
        run: |
          mkdir -p build/skills
          python scripts/package_skills.py skills/multica-delivery-policy build/skills/multica-delivery-policy.zip
          python scripts/package_skills.py skills/multica-requirement-intake build/skills/multica-requirement-intake.zip
          python scripts/package_skills.py skills/multica-workflow-manager build/skills/multica-workflow-manager.zip
          python scripts/package_skills.py skills/multica-workflow-incidents build/skills/multica-workflow-incidents.zip
          python scripts/package_skills.py skills/multica-workflow-console build/skills/multica-workflow-console.zip
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          for path in sorted(Path('build/skills').glob('*.zip')):
              print(f"{sha256(path.read_bytes()).hexdigest()}  {path}")
          PY
