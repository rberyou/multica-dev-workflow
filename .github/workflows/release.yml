name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved release tag to recover
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Resolve approved release tag
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" == v* ]]
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          release_sha=$(git rev-list -n 1 "${RELEASE_TAG}")
          test -n "${release_sha}"
          test "${release_sha}" = "$(git rev-parse HEAD)"
          echo "RELEASE_SHA=${release_sha}" >> "${GITHUB_ENV}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: python -m pip install -r requirements.txt check-jsonschema
      - name: Validate and test
        run: |
          check-jsonschema --schemafile workflow.schema.json workflow.json
          python -m py_compile scripts/workflow.py scripts/workflow_lib.py scripts/package_skills.py scripts/generate_audit_contract.py scripts/release.py skills/multica-workflow-observer/scripts/observer.py
          python scripts/generate_audit_contract.py --check
          python -m unittest discover -s tests -v
      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          python scripts/release.py verify-tag --tag "${RELEASE_TAG}"
          pr_count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == "'"${RELEASE_SHA}"'")] | length')
          test "${pr_count}" -eq 1
          green_count=$(gh run list --commit "${RELEASE_SHA}" --workflow validate --limit 20 \
            --json status,conclusion,headSha \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success" and .headSha == "'"${RELEASE_SHA}"'")] | length')
          test "${green_count}" -ge 1
      - name: Build release assets
        run: |
          mkdir -p build/release
          python scripts/package_skills.py skills/multica-requirement-intake build/release/multica-requirement-intake-${RELEASE_TAG}.zip
          python scripts/package_skills.py skills/multica-workflow-manager build/release/multica-workflow-manager-${RELEASE_TAG}.zip
          python scripts/package_skills.py skills/multica-workflow-observer build/release/multica-workflow-observer-${RELEASE_TAG}.zip
          python scripts/package_skills.py skills/multica-workflow-maintainer build/release/multica-workflow-maintainer-${RELEASE_TAG}.zip
          git archive --format=zip --output=build/release/multica-dev-workflow-${RELEASE_TAG}.zip "${RELEASE_TAG}"
          cd build/release
          sha256sum *.zip > checksums.txt
      - name: Verify approved release asset set
        run: python scripts/release.py verify-assets --tag "${RELEASE_TAG}" --directory build/release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "${RELEASE_TAG}" build/release/* \
            --verify-tag \
            --title "Multica Workflow ${RELEASE_TAG}" \
            --generate-notes \
            ${prerelease}
