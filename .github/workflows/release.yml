name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: python -m pip install -r requirements.txt check-jsonschema
      - name: Validate and test
        run: |
          check-jsonschema --schemafile workflow.schema.json workflow.json
          python -m py_compile scripts/workflow.py scripts/workflow_lib.py scripts/package_skills.py scripts/generate_audit_contract.py scripts/release.py skills/multica-workflow-observer/scripts/observer.py
          python scripts/generate_audit_contract.py --check
          python -m unittest discover -s tests -v
      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          python scripts/release.py verify-tag --tag "${GITHUB_REF_NAME}"
          pr_count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == "'"${GITHUB_SHA}"'")] | length')
          test "${pr_count}" -eq 1
          green_count=$(gh run list --commit "${GITHUB_SHA}" --workflow validate --limit 20 \
            --json status,conclusion,headSha \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success" and .headSha == "'"${GITHUB_SHA}"'")] | length')
          test "${green_count}" -ge 1
      - name: Build release assets
        run: |
          mkdir -p build/release
          python scripts/package_skills.py skills/multica-requirement-intake build/release/multica-requirement-intake-${GITHUB_REF_NAME}.zip
          python scripts/package_skills.py skills/multica-workflow-manager build/release/multica-workflow-manager-${GITHUB_REF_NAME}.zip
          python scripts/package_skills.py skills/multica-workflow-observer build/release/multica-workflow-observer-${GITHUB_REF_NAME}.zip
          python scripts/package_skills.py skills/multica-workflow-maintainer build/release/multica-workflow-maintainer-${GITHUB_REF_NAME}.zip
          git archive --format=zip --output=build/release/multica-dev-workflow-${GITHUB_REF_NAME}.zip HEAD
          cd build/release
          sha256sum *.zip > checksums.txt
      - name: Verify approved release asset set
        run: python scripts/release.py verify-assets --tag "${GITHUB_REF_NAME}" --directory build/release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" build/release/* \
            --verify-tag \
            --title "Multica Workflow ${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease}
