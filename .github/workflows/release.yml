name: release

on:
  workflow_dispatch:
    inputs:
      request_b64:
        description: Base64url-encoded, digest-bound release Request
        required: true
        type: string
      recover_existing_tag:
        description: Recover asset publication for the existing approved tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  validate-request:
    runs-on: ubuntu-latest
    outputs:
      release_request_digest: ${{ steps.request.outputs.release_request_digest }}
      release_plan_digest: ${{ steps.request.outputs.release_plan_digest }}
      source_commit: ${{ steps.request.outputs.source_commit }}
      tag: ${{ steps.request.outputs.tag }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"
      - name: Decode release Request
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
        shell: bash
        run: |
          mkdir -p .multica/release-request
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ["REQUEST_B64"]
          padding = "=" * (-len(encoded) % 4)
          Path(".multica/release-request/request.json").write_bytes(
              base64.urlsafe_b64decode(encoded + padding)
          )
          PY
      - name: Install validation tools
        run: python -m pip install -r requirements.txt check-jsonschema
      - name: Verify release Request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py verify-request \
            --request .multica/release-request/request.json \
            --expected-source "${GITHUB_SHA}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Validate and test
        run: |
          check-jsonschema --schemafile workflow.schema.json workflow.json
          check-jsonschema --schemafile docs/release-control-evidence.schema.json docs/release-control-evidence.json
          check-jsonschema --schemafile secure-runtime/policy/security-profile.schema.json secure-runtime/policy/runtime.example.json
          python -m py_compile scripts/workflow.py scripts/workflow_lib.py scripts/package_skills.py scripts/package_secure_runtime.py scripts/generate_audit_contract.py scripts/generate_secure_runtime_manifest.py scripts/release.py skills/multica-workflow-observer/scripts/observer.py skills/multica-workflow-maintainer/scripts/maintenance_loop.py skills/multica-workflow-console/scripts/workflow_console.py
          python scripts/generate_audit_contract.py --check
          python scripts/generate_secure_runtime_manifest.py --check
          python -m unittest discover -s tests -v
          dotnet build secure-runtime/WorkflowSecureRuntime.sln --configuration Release
          dotnet run --project secure-runtime/tests/WorkflowSecureRuntime.Tests/WorkflowSecureRuntime.Tests.csproj --configuration Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: release-request-${{ steps.request.outputs.release_request_digest }}
          path: .multica/release-request/request.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate-request
    runs-on: ubuntu-latest
    environment: workflow-release
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-request.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"
      - name: Install validation tools
        run: python -m pip install -r requirements.txt check-jsonschema
      - uses: actions/download-artifact@v5
        with:
          name: release-request-${{ needs.validate-request.outputs.release_request_digest }}
          path: .multica/release-request
      - name: Verify protected publish gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py verify-publish-gate \
            --request .multica/release-request/request.json \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --environment workflow-release \
            --output .multica/release-request/publish-gate.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Mint Publisher App token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.WORKFLOW_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_PUBLISHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: multica-dev-workflow
      - name: Create or recover approved tag
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          RECOVER_EXISTING_TAG: ${{ inputs.recover_existing_tag }}
        shell: bash
        run: |
          recovery_flag=""
          if [[ "${RECOVER_EXISTING_TAG}" == "true" ]]; then
            recovery_flag="--recover-existing-tag"
          fi
          python scripts/release.py publish \
            --request .multica/release-request/request.json \
            --gate .multica/release-request/publish-gate.json \
            --approve "${{ steps.gate.outputs.publish_gate_digest }}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --environment workflow-release \
            ${recovery_flag}
      - name: Verify protected tag provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py verify-tag --tag "${{ needs.validate-request.outputs.tag }}"
      - name: Build release assets
        run: |
          mkdir -p build/release
          python scripts/package_skills.py skills/multica-requirement-intake build/release/multica-requirement-intake-${{ needs.validate-request.outputs.tag }}.zip
          python scripts/package_skills.py skills/multica-workflow-manager build/release/multica-workflow-manager-${{ needs.validate-request.outputs.tag }}.zip
          python scripts/package_skills.py skills/multica-workflow-observer build/release/multica-workflow-observer-${{ needs.validate-request.outputs.tag }}.zip
          python scripts/package_skills.py skills/multica-workflow-maintainer build/release/multica-workflow-maintainer-${{ needs.validate-request.outputs.tag }}.zip
          python scripts/package_skills.py skills/multica-workflow-console build/release/multica-workflow-console-${{ needs.validate-request.outputs.tag }}.zip
          python scripts/package_secure_runtime.py build/release/multica-workflow-secure-runtime-win-x64-${{ needs.validate-request.outputs.tag }}.zip
          git archive --format=zip --output=build/release/multica-dev-workflow-${{ needs.validate-request.outputs.tag }}.zip "${{ needs.validate-request.outputs.tag }}"
          cd build/release
          sha256sum *.zip > checksums.txt
      - name: Verify approved release asset set
        run: python scripts/release.py verify-assets --tag "${{ needs.validate-request.outputs.tag }}" --directory build/release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          RECOVER_EXISTING_TAG: ${{ inputs.recover_existing_tag }}
        shell: bash
        run: |
          recovery_flag=""
          if [[ "${RECOVER_EXISTING_TAG}" == "true" ]]; then
            recovery_flag="--recover-existing-tag"
          fi
          python scripts/release.py publish-release \
            --request .multica/release-request/request.json \
            --gate .multica/release-request/publish-gate.json \
            --approve "${{ steps.gate.outputs.publish_gate_digest }}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --environment workflow-release \
            --directory build/release \
            ${recovery_flag}
