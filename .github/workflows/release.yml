name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: python -m pip install check-jsonschema
      - name: Validate and test
        run: |
          check-jsonschema --schemafile workflow.schema.json workflow.json
          python -m unittest discover -s tests -v
      - name: Build release assets
        run: |
          mkdir -p build/release
          python scripts/package_skills.py skills/multica-requirement-intake build/release/multica-requirement-intake-${GITHUB_REF_NAME}.zip
          python scripts/package_skills.py skills/multica-workflow-manager build/release/multica-workflow-manager-${GITHUB_REF_NAME}.zip
          git archive --format=zip --output=build/release/multica-dev-workflow-${GITHUB_REF_NAME}.zip HEAD
          cd build/release
          sha256sum *.zip > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" build/release/* \
            --verify-tag \
            --title "Multica Workflow ${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease}
